<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A08FFF"/>
      <stop offset="1" stop-color="#5B9DFF"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C6CF0"/>
      <stop offset="1" stop-color="#4F63D8"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9D0FF"/>
      <stop offset="1" stop-color="#B6A6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7A3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFE7A3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- antenna -->
  <path d="M256 128 Q266 96 256 70" stroke="#B6A6FF" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="256" cy="62" r="40" fill="url(#glow)"/>
  <circle cx="256" cy="62" r="17" fill="#FFD36E"/>
  <!-- cube: top, left, right faces (rounded via stroke-linejoin) -->
  <g stroke-linejoin="round" stroke-width="22">
    <path d="M256 120 L410 196 L256 272 L102 196 Z" fill="url(#top)" stroke="url(#top)"/>
    <path d="M102 196 L256 272 L256 446 L102 362 Z" fill="url(#left)" stroke="url(#left)"/>
    <path d="M410 196 L256 272 L256 446 L410 362 Z" fill="url(#side)" stroke="url(#side)"/>
  </g>
  <!-- face on the front-left face -->
  <ellipse cx="160" cy="300" rx="15" ry="21" fill="#14123A"/>
  <ellipse cx="214" cy="326" rx="15" ry="21" fill="#14123A"/>
  <circle cx="165" cy="292" r="5" fill="#FFFFFF"/>
  <circle cx="219" cy="318" r="5" fill="#FFFFFF"/>
  <path d="M168 352 Q186 370 204 362" stroke="#14123A" stroke-width="8" stroke-linecap="round" fill="none"/>
  <ellipse cx="140" cy="336" rx="14" ry="8" fill="#FF9DC0" opacity="0.7"/>
</svg>
